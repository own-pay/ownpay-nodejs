name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # There is no committed lockfile (package-lock.json is gitignored), so
        # every run resolves the tree fresh. npm 10.8.x (bundled with Node 20)
        # has crashed intermittently during that resolution with
        # "Cannot read properties of null (reading 'edgesOut')". Retry once so a
        # transient npm crash does not fail the whole job.
        run: npm install || npm install

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
