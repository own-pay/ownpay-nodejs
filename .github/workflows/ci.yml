name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # npm 10.8.x (bundled with Node 20.20.x) crashes while resolving the
      # dependency tree, because package-lock.json is gitignored and every run
      # resolves fresh: "Cannot read properties of null (reading 'edgesOut')".
      # Node 20 jobs therefore upgrade to npm 10.9.9, which installs cleanly on
      # the other matrix versions.
      - name: Upgrade npm (Node 20 only)
        if: matrix.node-version == 20
        run: npm install -g npm@10.9.9

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
